<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Dhia Shalabi, Senior Software Engineer, backend and AI systems, Riyadh. A small container ship named SHIP IT sails past on animated waves."><title>Dhia Shalabi, Senior Software Engineer, backend and AI systems, Riyadh. A small container ship named SHIP IT sails past on animated waves.</title><style>@keyframes w1{to{transform:translateX(-240px)}}@keyframes w2{to{transform:translateX(-200px)}}@keyframes w3{to{transform:translateX(-160px)}}.w1{animation:w1 16s linear infinite}.w2{animation:w2 10s linear infinite}.w3{animation:w3 7s linear infinite}@keyframes bob{0%,100%{transform:translateY(0) rotate(-.5deg)}50%{transform:translateY(-5px) rotate(.6deg)}}.bob{transform-box:fill-box;transform-origin:50% 100%;animation:bob 6s ease-in-out infinite}@keyframes drift{0%,100%{transform:translateX(16px)}50%{transform:translateX(-30px)}}.drift{animation:drift 34s ease-in-out infinite}@keyframes puff{0%{transform:translate(0,0) scale(.7);opacity:0}15%{opacity:.6}100%{transform:translate(-46px,-58px) scale(2.4);opacity:0}}.puff{transform-box:fill-box;transform-origin:center;opacity:0;animation:puff 6s ease-out infinite}.p2{animation-delay:2s}.p3{animation-delay:4s}@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}.tw{animation:tw 5s ease-in-out infinite}@keyframes glint{0%,100%{opacity:.08}50%{opacity:.5}}.glint{opacity:.25;animation:glint 4s ease-in-out infinite}@keyframes cloud{to{transform:translateX(-1300px)}}.cloud{animation:cloud 90s linear infinite}@keyframes rot{0%,21%{opacity:1}25%,96%{opacity:0}100%{opacity:1}}.ph{opacity:0;animation:rot 16s linear infinite}.ph.first{opacity:1}@keyframes blink{50%{opacity:0}}.cur{animation:blink 1.1s steps(1) infinite}@keyframes flag{50%{transform:skewY(4deg)}}.flag{transform-box:fill-box;transform-origin:0 50%;animation:flag 2.4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
